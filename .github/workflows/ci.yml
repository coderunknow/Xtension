name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      published_tag:
        description: 'Optional published tag: check out its exact source and test its downloaded EXEs'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-tests:
    name: Static checks and unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.published_tag || github.event.pull_request.head.sha || github.sha }}
      - name: Verify source consistency
        shell: pwsh
        run: ./scripts/verify-source.ps1
      - name: Run unit tests (pure core)
        shell: pwsh
        run: ./scripts/test.ps1

      - name: Windows PowerShell 5.1 source and test parity
        shell: powershell
        run: |
          ./scripts/verify-source.ps1
          ./scripts/test.ps1

  build:
    name: Build ${{ matrix.arch }}
    timeout-minutes: 10
    needs: static-and-tests
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.published_tag || github.event.pull_request.head.sha || github.sha }}
      - name: Build Xtension (${{ matrix.arch }})
        shell: pwsh
        run: ./scripts/build.ps1 -Arch ${{ matrix.arch }}
      - name: Windows synthetic UIA and layout regressions
        shell: powershell
        run: ./scripts/test-windows.ps1 -Arch ${{ matrix.arch }}
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xtension-win-${{ matrix.arch }}
          path: |
            dist/Xtension-win-${{ matrix.arch }}.exe
            dist/Xtension-win-${{ matrix.arch }}.exe.build.json
          if-no-files-found: error
          retention-days: 14

  msbuild-project:
    name: MSBuild project check
    needs: static-and-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.published_tag || github.event.pull_request.head.sha || github.sha }}
      - uses: microsoft/setup-msbuild@v2
      - name: Build Xtension.csproj (Release, x64)
        shell: pwsh
        run: msbuild Xtension.csproj /restore /p:Configuration=Release /p:Platform=x64 /v:minimal /nologo

  package-check:
    name: Package provenance and checksums
    needs: [build, msbuild-project]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.published_tag || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: Xtension-win-*
          path: dist
          merge-multiple: true
      - name: Verify packaging and reject stale provenance
        shell: powershell
        run: ./scripts/test-package.ps1

  brave-smoke:
    name: Isolated real Brave smoke ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    needs: static-and-tests
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.published_tag || github.event.pull_request.head.sha || github.sha }}
      - name: Build candidate and Windows harness
        shell: powershell
        run: |
          ./scripts/build.ps1 -Arch ${{ matrix.arch }}
          ./scripts/test-windows.ps1 -Arch ${{ matrix.arch }}
      - name: Substitute checksum-verified published EXE for runtime acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.published_tag != ''
        shell: powershell
        env:
          PUBLISHED_TAG: ${{ inputs.published_tag }}
          TEST_ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:PUBLISHED_TAG
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($tag -ne "v$version") { throw 'Published tag must match checked-out VERSION.' }
          $asset = "Xtension-$tag-win-$($env:TEST_ARCH).exe"
          $destination = 'dist/published-runtime'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          & gh release download $tag --pattern $asset --pattern SHA256SUMS.txt --dir $destination
          if ($LASTEXITCODE -ne 0) { throw 'Published binary download failed.' }
          $line = @(Get-Content -LiteralPath (Join-Path $destination 'SHA256SUMS.txt') | Where-Object { $_.EndsWith("  $asset") })
          if ($line.Count -ne 1) { throw 'Published binary missing or duplicated in checksum manifest.' }
          $expected = ($line[0] -split '  ', 2)[0]
          $actual = (Get-FileHash -LiteralPath (Join-Path $destination $asset) -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Published EXE checksum mismatch.' }
          Copy-Item -LiteralPath (Join-Path $destination $asset) -Destination "dist/Xtension-win-$($env:TEST_ARCH).exe" -Force
          Write-Host "::notice title=Published binary under test::$asset sha256=$actual"
      - name: Run shipped candidate against isolated Brave profile
        shell: powershell
        run: ./scripts/test-brave.ps1 -Arch ${{ matrix.arch }}
