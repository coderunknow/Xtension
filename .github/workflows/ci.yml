name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      published_tag:
        description: 'Optional published tag: check out its exact source and test its downloaded EXEs'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-tests:
    name: Static checks and unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.published_tag || github.event.pull_request.head.sha || github.sha }}
      - name: Verify source consistency
        shell: pwsh
        run: ./scripts/verify-source.ps1
      - name: Run unit tests (pure core)
        shell: pwsh
        run: ./scripts/test.ps1

      - name: Windows PowerShell 5.1 source and test parity
        shell: powershell
        run: |
          ./scripts/verify-source.ps1
          ./scripts/test.ps1
          ./scripts/test-fixture-process.ps1

  build:
    name: Build ${{ matrix.arch }}
    timeout-minutes: 10
    needs: static-and-tests
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.published_tag || github.event.pull_request.head.sha || github.sha }}
      - name: Build Xtension (${{ matrix.arch }})
        shell: pwsh
        run: ./scripts/build.ps1 -Arch ${{ matrix.arch }}
      - name: Windows synthetic UIA and layout regressions
        shell: powershell
        run: ./scripts/test-windows.ps1 -Arch ${{ matrix.arch }}
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xtension-win-${{ matrix.arch }}
          path: |
            dist/Xtension-win-${{ matrix.arch }}.exe
            dist/Xtension-win-${{ matrix.arch }}.exe.build.json
          if-no-files-found: error
          retention-days: 14

  msbuild-project:
    name: MSBuild project check
    needs: static-and-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.published_tag || github.event.pull_request.head.sha || github.sha }}
      - uses: microsoft/setup-msbuild@v2
      - name: Build Xtension.csproj (Release, x64)
        shell: pwsh
        run: msbuild Xtension.csproj /restore /p:Configuration=Release /p:Platform=x64 /v:minimal /nologo

  package-check:
    name: Package provenance and checksums
    needs: [build, msbuild-project]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.published_tag || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: Xtension-win-*
          path: dist
          merge-multiple: true
      - name: Verify packaging and reject stale provenance
        shell: powershell
        run: ./scripts/test-package.ps1

  performance:
    name: Published baseline vs candidate resources (x64)
    needs: [static-and-tests]
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.published_tag || github.event.pull_request.head.sha || github.sha }}
      - name: Build candidate, harness and measure script inputs (x64)
        shell: powershell
        run: |
          ./scripts/build.ps1 -Arch x64
          ./scripts/test-windows.ps1 -Arch x64
      - name: Download and checksum-verify the published baseline
        shell: powershell
        env:
          BASELINE_TAG: v0.1.0-dev4
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:BASELINE_TAG
          $asset = "Xtension-$tag-win-x64.exe"
          $destination = 'dist/baseline'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          & gh release download $tag --pattern $asset --pattern SHA256SUMS.txt --dir $destination --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Published baseline download failed.' }
          $line = @(Get-Content -LiteralPath (Join-Path $destination 'SHA256SUMS.txt') | Where-Object { $_.EndsWith("  $asset") })
          if ($line.Count -ne 1) { throw 'Published baseline is missing or duplicated in its checksum manifest.' }
          $expected = ($line[0] -split '  ', 2)[0]
          $actual = (Get-FileHash -LiteralPath (Join-Path $destination $asset) -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Published baseline checksum mismatch.' }
          & git fetch --no-tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if ($LASTEXITCODE -ne 0) { throw 'Baseline source tag fetch failed.' }
          $sourceVersion = (& git show "${tag}:VERSION").Trim()
          if ($LASTEXITCODE -ne 0 -or $tag -ne "v$sourceVersion") { throw 'Baseline source/version mismatch.' }
          $binary = Join-Path $destination $asset
          if ([System.Diagnostics.FileVersionInfo]::GetVersionInfo($binary).ProductVersion -ne $sourceVersion) { throw 'Baseline executable version mismatch.' }
          # The published dev4 x64 hash is pinned independently of the downloaded manifest.
          if ($actual -ne '35b5a67b2c416666b61d43dc1451e8e17c49c081c65226ec5e8cea407c6cce82') { throw 'Baseline differs from recorded dev4 bytes.' }
          $baselineCommit = (& git rev-parse "${tag}^{}").Trim()
          Write-Host "::notice title=Published baseline under measurement::$asset sha256=$actual source=$baselineCommit version=$sourceVersion"
      - name: Measure both shipped EXEs on this runner
        shell: powershell
        env:
          BASELINE_TAG: v0.1.0-dev4
        run: |
          ./scripts/measure-performance.ps1 -Arch x64 -Seconds 20 `
            -Baseline ("dist/baseline/Xtension-" + $env:BASELINE_TAG + "-win-x64.exe") `
            -Candidate 'dist/Xtension-win-x64.exe' `
            -BaselineLabel $env:BASELINE_TAG -CandidateLabel 'candidate'
      - name: Publish complete resource summary
        shell: powershell
        run: |
          $summary = (Get-Content -LiteralPath dist/perf/performance-x64.txt -Raw).Trim().Replace("`r`n", "%0A").Replace("`n", "%0A")
          Write-Host ("::notice title=Complete resource comparison::" + $summary)
      - name: Upload resource evidence
        uses: actions/upload-artifact@v4
        with:
          name: performance-evidence
          path: dist/perf/performance-x64.txt
          if-no-files-found: error
          retention-days: 30

  brave-smoke:
    name: Isolated real browser ${{ matrix.browser }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
        browser: [brave, chrome, edge]
    needs: static-and-tests
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.published_tag || github.event.pull_request.head.sha || github.sha }}
      - name: Build candidate and Windows harness
        shell: powershell
        run: |
          ./scripts/build.ps1 -Arch ${{ matrix.arch }}
          ./scripts/test-windows.ps1 -Arch ${{ matrix.arch }}
      - name: Detect matching published application source
        id: published
        shell: powershell
        env:
          REQUESTED_TAG: ${{ inputs.published_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:REQUESTED_TAG
          if (-not $tag) { $tag = 'v' + (Get-Content -LiteralPath VERSION -Raw).Trim() }
          # Windows PowerShell 5.1 promotes a redirected native stderr line to a terminating error while
          # $ErrorActionPreference is 'Stop', and `gh release view` writes "release not found" to stderr for a tag that
          # is not published yet, so the probe would kill the step before its exit code could be read. Probe with
          # 'Continue' and judge the release by the exit code only.
          $saved = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try {
            & gh release view $tag --json tagName 1>$null 2>$null
            $viewed = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $saved
          }
          if ($viewed -ne 0) {
            if ($env:REQUESTED_TAG) { throw 'Requested publication is unavailable.' }
            Write-Host 'No matching publication yet; test the newly built candidate.'
            exit 0
          }
          & git fetch --no-tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch published source tag.' }
          & git diff --exit-code HEAD $tag -- src VERSION Xtension.csproj app.manifest.template scripts/build.ps1 scripts/update-version.ps1 scripts/toolchain.ps1
          $difference = $LASTEXITCODE
          if ($difference -eq 1 -and -not $env:REQUESTED_TAG) {
            Write-Host 'Published application source differs; test the newly built candidate instead.'
            exit 0
          }
          if ($difference -ne 0) { throw 'Published application source does not match.' }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Substitute checksum-verified published EXE for runtime acceptance
        if: steps.published.outputs.tag != ''
        shell: powershell
        env:
          PUBLISHED_TAG: ${{ steps.published.outputs.tag }}
          TEST_ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:PUBLISHED_TAG
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($tag -ne "v$version") { throw 'Published tag must match checked-out VERSION.' }
          $asset = "Xtension-$tag-win-$($env:TEST_ARCH).exe"
          $destination = 'dist/published-runtime'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          & gh release download $tag --pattern $asset --pattern SHA256SUMS.txt --dir $destination
          if ($LASTEXITCODE -ne 0) { throw 'Published binary download failed.' }
          $line = @(Get-Content -LiteralPath (Join-Path $destination 'SHA256SUMS.txt') | Where-Object { $_.EndsWith("  $asset") })
          if ($line.Count -ne 1) { throw 'Published binary missing or duplicated in checksum manifest.' }
          $expected = ($line[0] -split '  ', 2)[0]
          $actual = (Get-FileHash -LiteralPath (Join-Path $destination $asset) -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Published EXE checksum mismatch.' }
          Copy-Item -LiteralPath (Join-Path $destination $asset) -Destination "dist/Xtension-win-$($env:TEST_ARCH).exe" -Force
          Write-Host "::notice title=Published binary under test::$asset sha256=$actual"
      - name: Run shipped candidate against isolated Brave profile
        shell: powershell
        run: ./scripts/test-brave.ps1 -Arch ${{ matrix.arch }} -Browser ${{ matrix.browser }}
