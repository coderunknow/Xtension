name: Release

# Runs only for a pushed v* tag. Publishes a PRERELEASE that is never marked latest.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify tag matches VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag and VERSION
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION (v${version})." >&2
            exit 1
          fi
          case "${version}" in
            *-*) echo "Prerelease version ${version}; release will be marked prerelease and not latest." ;;
            *) echo "::error::Stable version ${version} is not allowed by this prerelease workflow." >&2; exit 1 ;;
          esac
      - name: Require exact merged main commit with successful CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          test "$commit" = "$main" || { echo 'Release tag must target current merged main.' >&2; exit 1; }
          count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${commit}&event=push&status=success&branch=main" --jq .total_count)"
          test "$count" -gt 0 || { echo 'No successful main CI for this exact release commit.' >&2; exit 1; }


  build:
    name: Build ${{ matrix.arch }}
    timeout-minutes: 10
    needs: verify-tag
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Verify source consistency
        shell: pwsh
        run: ./scripts/verify-source.ps1
      - name: Run unit tests
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Build Xtension (${{ matrix.arch }})
        shell: pwsh
        run: ./scripts/build.ps1 -Arch ${{ matrix.arch }}
      - name: Windows synthetic UIA and layout regressions
        shell: powershell
        run: ./scripts/test-windows.ps1 -Arch ${{ matrix.arch }}
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: Xtension-win-${{ matrix.arch }}
          path: |
            dist/Xtension-win-${{ matrix.arch }}.exe
            dist/Xtension-win-${{ matrix.arch }}.exe.build.json
          if-no-files-found: error
          retention-days: 2

  browser-acceptance:
    name: Release browser ${{ matrix.browser }} ${{ matrix.arch }}
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
        browser: [brave, chrome, edge]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Xtension-win-${{ matrix.arch }}
          path: dist
      - name: Build and exercise harness without replacing release executable
        shell: powershell
        run: ./scripts/test-windows.ps1 -Arch ${{ matrix.arch }}
      - name: Accept exact release executable with isolated browser profile
        shell: powershell
        run: ./scripts/test-brave.ps1 -Arch ${{ matrix.arch }} -Browser ${{ matrix.browser }}

  publish:
    name: Publish prerelease
    needs: [build, browser-acceptance]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          pattern: Xtension-win-*
          path: dist
          merge-multiple: true
      - name: Package release assets
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Show checksums
        shell: pwsh
        run: Get-Content -LiteralPath dist/release/SHA256SUMS.txt
      - name: Publish GitHub prerelease (not latest)
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          & gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists. Refusing to overwrite it." }
          $assets = Get-ChildItem -LiteralPath dist/release -File | Where-Object { $_.Name -ne 'RELEASE_NOTES.md' } | ForEach-Object { $_.FullName }
          & gh release create $tag @assets --verify-tag --prerelease --latest=false --title "Xtension $tag" --notes-file dist/release/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed.' }
      - name: Verify published assets by downloading them again
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $destination = 'dist/published-verification'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          & gh release download $tag --dir $destination
          if ($LASTEXITCODE -ne 0) { throw 'Published asset download failed.' }
          $metadata = & gh release view $tag --json isPrerelease,isDraft,tagName,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Published release metadata query failed.' }
          if (-not $metadata.isPrerelease -or $metadata.isDraft -or $metadata.tagName -ne $tag -or $metadata.assets.Count -ne 4) {
            throw 'Published release metadata or asset count is incorrect.'
          }
          $manifest = Join-Path $destination 'SHA256SUMS.txt'
          if ((Get-FileHash $manifest).Hash -ne (Get-FileHash 'dist/release/SHA256SUMS.txt').Hash) {
            throw 'Published checksum manifest differs from packaged manifest.'
          }
          foreach ($line in Get-Content -LiteralPath $manifest) {
            $parts = $line -split '  ', 2
            $hash = (Get-FileHash -LiteralPath (Join-Path $destination $parts[1]) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $parts[0]) { throw "Published checksum mismatch: $($parts[1])" }
            Write-Host "::notice title=Published asset verified::$($parts[1]) sha256=$hash"
          }
