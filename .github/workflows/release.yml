name: Release

# Runs only for a pushed v* tag. Publishes a PRERELEASE that is never marked latest.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify tag matches VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag and VERSION
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION (v${version})." >&2
            exit 1
          fi
          case "${version}" in
            *-*) echo "Prerelease version ${version}; release will be marked prerelease and not latest." ;;
            *) echo "::error::Stable version ${version} is not allowed by this prerelease workflow." >&2; exit 1 ;;
          esac

  build:
    name: Build ${{ matrix.arch }}
    needs: verify-tag
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Verify source consistency
        shell: pwsh
        run: ./scripts/verify-source.ps1
      - name: Run unit tests
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Build Xtension (${{ matrix.arch }})
        shell: pwsh
        run: ./scripts/build.ps1 -Arch ${{ matrix.arch }}
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: Xtension-win-${{ matrix.arch }}
          path: dist/Xtension-win-${{ matrix.arch }}.exe
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish prerelease
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          pattern: Xtension-win-*
          path: dist
          merge-multiple: true
      - name: Package release assets
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Show checksums
        shell: pwsh
        run: Get-Content -LiteralPath dist/release/SHA256SUMS.txt
      - name: Publish GitHub prerelease (not latest)
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          & gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists. Refusing to overwrite it." }
          $assets = Get-ChildItem -LiteralPath dist/release -File | Where-Object { $_.Name -ne 'RELEASE_NOTES.md' } | ForEach-Object { $_.FullName }
          & gh release create $tag @assets --verify-tag --prerelease --latest=false --title "Xtension $tag" --notes-file dist/release/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed.' }
